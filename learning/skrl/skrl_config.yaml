# SKRL Training Configuration for Traffic Environment
# 配置SKRL PPO训练的所有参数

# Environment settings
environment:
  name: "TrafficEnv"
  num_envs: 1024
  max_episode_length: 1000
  headless: true

# Agent configuration
agent:
  algorithm: "PPO"
  
  # PPO specific parameters
  rollouts: 64                    # Number of steps per rollout
  mini_batches: 16               # Number of mini-batches per update
  learning_epochs: 4             # Number of learning epochs per update
  
  # Learning parameters
  learning_rate: 4.0e-5
  learning_rate_scheduler: "KLAdaptiveLR"
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
  
  # PPO clipping
  ratio_clip: 0.1                # PPO policy ratio clipping
  value_clip: 0.1                # PPO value clipping
  clip_predicted_values: true
  
  # Loss coefficients
  entropy_loss_scale: 0.001      # Entropy bonus coefficient
  value_loss_scale: 0.5          # Value function loss coefficient
  
  # Discount and GAE
  discount_factor: 0.99          # Gamma
  lambda: 0.95                   # GAE lambda
  
  # Optimization
  grad_norm_clip: 0.5            # Gradient clipping
  
  # Experience replay
  memory_size: 64                # Memory buffer size
  random_timesteps: 0            # Random exploration timesteps
  learning_starts: 0             # When to start learning

# Network architecture
network:
  # GAT specific parameters
  robot_node_input_size: 7
  human_node_input_size: 3
  max_human_num: 10
  human_node_embedding_size: 64
  attention_size: 256
  human_node_output_size: 256
  
  # GAT layer parameters
  dropout: 0.1
  alpha: 0.2                     # LeakyReLU negative slope
  num_heads: 4                   # Number of attention heads
  hidden_dim_per_head: 64        # Hidden dimension per attention head

# Training parameters
training:
  total_timesteps: 20000000      # Total training timesteps
  log_interval: 10               # Log every N updates
  save_interval: 1000            # Save model every N updates
  eval_interval: 100             # Evaluate every N updates
  
# Experiment settings
experiment:
  name: null                     # Will be auto-generated if null
  directory: "runs/traffic_skrl"
  write_interval: 10             # Write logs every N updates
  checkpoint_interval: 1000      # Save checkpoints every N updates

# Traffic environment specific
traffic:
  drones_num: 5
  evtols_num: 1
  drone_future_penalty: 0.0
  evtol_future_penalty: 0.0
  drones_threshold_factor: null
  drones_decay_factor: null
  evtols_threshold_factor: null  
  evtols_decay_factor: null
  rew_success: null
  rew_collision: null
  predict_steps: 5

# Logging
logging:
  use_tensorboard: true
  tensorboard_dir: "tensorboard"
  
  use_wandb: false
  wandb_project: "omni_drones_traffic_skrl"
  wandb_entity: null
  wandb_run_name: null
  wandb_tags: ["skrl", "ppo", "traffic", "gat"]

# Callbacks
callbacks:
  success_rate:
    enabled: true
    check_freq: 10
    queue_size: 1000
    success_threshold: 0.8
    
  model_checkpoint:
    enabled: true
    save_interval: 10000
    
  episode_stats:
    enabled: true
    log_interval: 100

# Isaac Lab specific
isaac_lab:
  headless: true
  device: "cuda"
  
# Seeds
seed: 42
