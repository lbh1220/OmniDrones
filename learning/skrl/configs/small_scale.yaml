# Small Scale Training Configuration
# 适用于快速测试和调试的小规模配置

# Environment settings
environment:
  name: "TrafficEnv"
  num_envs: 128                  # 小规模环境数量
  max_episode_length: 500        # 较短的episode长度
  headless: true

# Agent configuration  
agent:
  algorithm: "PPO"
  
  # PPO specific parameters
  rollouts: 32                   # 较少的rollout步数
  mini_batches: 8                # 较少的mini-batch
  learning_epochs: 3             # 较少的学习epoch
  
  # Learning parameters
  learning_rate: 5.0e-5          # 稍高的学习率
  learning_rate_scheduler: "KLAdaptiveLR"
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
  
  # PPO clipping
  ratio_clip: 0.1
  value_clip: 0.1
  clip_predicted_values: true
  
  # Loss coefficients  
  entropy_loss_scale: 0.01       # 更高的熵系数用于探索
  value_loss_scale: 0.5
  
  # Discount and GAE
  discount_factor: 0.99
  lambda: 0.95
  
  # Optimization
  grad_norm_clip: 0.5
  
  # Experience replay
  memory_size: 32
  random_timesteps: 0
  learning_starts: 0

# Network architecture
network:
  robot_node_input_size: 7
  human_node_input_size: 3
  max_human_num: 5               # 较少的human数量
  human_node_embedding_size: 32  # 较小的embedding
  attention_size: 128            # 较小的attention size
  human_node_output_size: 128    # 较小的输出size
  
  # GAT layer parameters
  dropout: 0.1
  alpha: 0.2
  num_heads: 2                   # 较少的注意力头
  hidden_dim_per_head: 32        # 较小的隐藏维度

# Training parameters
training:
  total_timesteps: 1000000       # 较少的总步数，用于快速测试
  log_interval: 5                # 更频繁的日志
  save_interval: 500             # 更频繁的保存
  eval_interval: 50              # 更频繁的评估

# Experiment settings
experiment:
  name: null
  directory: "runs/traffic_skrl_small"
  write_interval: 5
  checkpoint_interval: 500

# Traffic environment specific
traffic:
  drones_num: 2                  # 较少的无人机
  evtols_num: 1                  # 1个eVTOL
  drone_future_penalty: 0.0
  evtol_future_penalty: 0.0
  drones_threshold_factor: null
  drones_decay_factor: null
  evtols_threshold_factor: null
  evtols_decay_factor: null
  rew_success: null
  rew_collision: null
  predict_steps: 3               # 较少的预测步数

# Logging
logging:
  use_tensorboard: true
  tensorboard_dir: "tensorboard"
  
  use_wandb: false
  wandb_project: "omni_drones_traffic_skrl_small"
  wandb_entity: null
  wandb_run_name: null
  wandb_tags: ["skrl", "ppo", "traffic", "gat", "small_scale"]

# Callbacks
callbacks:
  success_rate:
    enabled: true
    check_freq: 5                # 更频繁的检查
    queue_size: 100              # 较小的队列
    success_threshold: 0.7       # 较低的成功阈值
    
  model_checkpoint:
    enabled: true
    save_interval: 5000
    
  episode_stats:
    enabled: true
    log_interval: 50

# Isaac Lab specific
isaac_lab:
  headless: true
  device: "cuda"

# Seeds
seed: 42
