cfg_class: isaac_lab_envs.direct.uam_env_cfg.NavrlEnvCfg

seed: 425
scene:
  num_envs: 512

viewer:
  resolution: [1080, 1080]
  eye: [0.0, 0.0, 160.0]
  lookat: [0.0, 0.0, 1.0]

action_manager:
  action_space_type: gaussian
  action_mode: velocity_components

observation_cfg:
  modules: ["robot_node", "lidar", "dynamic_obstacle"]

reward_cfg:
  modules: ["navrl"]

traffic_sim:
  num_drones: 10
  num_evtols: 0

arrival_threshold: -1.0
use_global_path: false


