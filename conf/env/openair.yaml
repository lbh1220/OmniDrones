cfg_class: isaac_lab_envs.direct.uam_env_cfg.OpenAirEnvCfg

seed: 425
scene:
  num_envs: 512

action_manager:
  action_space_type: gaussian
  action_mode: velocity_components

observation_cfg:
  modules: ["robot_node", "traffic_spatial_edges"]

reward_cfg:
  modules: ["nav"]

traffic_sim:
  num_drones: 10
  num_evtols: 1

arrival_threshold: 2.0


