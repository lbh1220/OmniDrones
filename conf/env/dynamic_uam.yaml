cfg_class: isaac_lab_envs.direct.uam_env_cfg.DyanmicUamEnvCfg

seed: 425
scene:
  num_envs: 512

action_manager:
  action_space_type: gaussian
  action_mode: velocity_components

observation_cfg:
  modules: ["robot_node", "lidar", "traffic_spatial_state"]

reward_cfg:
  modules: ["nav", "traffic_future", "cross_track"]

traffic_sim:
  num_drones: 10
  num_evtols: 1

arrival_threshold: 2.0
predict_steps: 5
rew_evtol_future_penalty: -2.0
rew_drone_future_penalty: -2.0


