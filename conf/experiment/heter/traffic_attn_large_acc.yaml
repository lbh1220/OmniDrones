name: traffic_attn_large_acc
defaults:
  - /env/large_traffic@env    
  - /model/traffic_attn@model  
  - /algo/ppo_skrl@algo    

# --- 覆盖 ---
env:
  observation_cfg:
    modules: ["robot_node", "traffic_spatial_state"] #
  reward_cfg:
    modules: ["nav", "traffic_future", "cross_track"] #
  # ... (其他 env 覆盖)
  arrival_threshold: 10.0
  safety_radius: 5.0
  max_speed: 1.5
  min_speed: 0.5
  v_pref: 1.5
  dv_limit: 0.2
  dtheta_limit_deg: 5.0
  use_global_path: True
  traffic_sim:
    num_drones: 10
    num_evtols: 1
    evtol:
      safety_radius: 8.0
  predict_steps: 5
  rew_potential: 0.5
  # rew_approaching_reward_coeff: 0.25
  rew_evtol_future_penalty: -2.0
  rew_evtols_threshold_factor: 1.2
  rew_evtols_decay_factor: 1.0
  rew_drone_future_penalty: -2.0
  rew_cross_track_coeff: 0.2
  rew_smoothness_coeff: -0.0
  action_manager:
    action_space_type: "beta"
    action_mode: "direction_acceleration"
    rl_action_frame: "world"
algo:
  rollouts: 128
  mini_batches: 32
  learning_rate: 4e-5
  entropy_loss_scale: 0.001
