name: ego_evtol
defaults:
  - /env/heter_traffic@env    
  - /model/traffic_attn@model  
  - /algo/ppo_skrl@algo    

# --- 覆盖 ---
env:
  observation_cfg:
    modules: ["robot_node", "traffic_spatial_state"] #
  reward_cfg:
    modules: ["nav", "traffic_future", "cross_track", "smoothness"] #
  # ... (其他 env 覆盖)
  max_speed: 2.0
  v_pref: 2.0
  safety_radius: 4.0
  arrival_threshold: 4.0
  use_global_path: True
  predict_steps: 5
  rew_evtol_future_penalty: -2.0
  rew_drone_future_penalty: -2.0
  rew_cross_track_coeff: -0.1
  rew_potential: 0.5
  rew_smoothness_coeff: -0.0
  action_manager:
    action_space_type: "beta"
    action_mode: "direction_acceleration"
    rl_action_frame: "world"
  traffic_sim:
    num_evtols: 2
    evtol:
      safety_radius: ${env.safety_radius}
algo:
  rollouts: 128
  mini_batches: 32
  learning_rate: 4e-5
  entropy_loss_scale: 0.001
