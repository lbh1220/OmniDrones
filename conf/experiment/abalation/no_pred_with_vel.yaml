name: no_pred_with_vel
defaults:
  - /env/heter_traffic@env    
  - /model/traffic_attn@model  
  - /algo/ppo_skrl@algo    

# --- 覆盖 ---
env:
  observation_cfg:
    modules: ["robot_node", "traffic_state"] #
  reward_cfg:
    modules: ["nav", "traffic_future", "cross_track", "smoothness"] #
  # ... (其他 env 覆盖)
  arrival_threshold: 2.0
  use_global_path: True
  predict_steps: 0
  rew_evtol_future_penalty: -2.0
  rew_drone_future_penalty: -2.0
  rew_cross_track_coeff: -0.1
  rew_smoothness_coeff: -0.0
  action_manager:
    action_space_type: "beta"
algo:
  rollouts: 128
  mini_batches: 32
  learning_rate: 4e-5
  entropy_loss_scale: 0.001
