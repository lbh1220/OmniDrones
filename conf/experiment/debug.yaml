name: navrl_baseline
defaults:
  - /env/dynamic_city@env    # <--- 加载 conf/env/dynamic_city.yaml 到 "env" 键
  - /model/navrl@model       # <--- 加载 conf/model/navrl.yaml 到 "model" 键
  - /algo/ppo_skrl@algo      # <--- 加载 conf/algo/ppo_skrl.yaml 到 "algo" 键

# --- 覆盖 ---
env:
  observation_cfg:
    modules: ["robot_node", "lidar", "dynamic_obstacle"] #
  reward_cfg:
    modules: ["navrl"] #
  # ... (其他 env 覆盖)
  arrival_threshold: -1.0
  use_global_path: False
  dynamic_obstacle_num: 5
  traffic_sim:
    num_drones: 10
    num_evtols: 0
