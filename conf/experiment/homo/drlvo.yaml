name: drlvo
defaults:
  - /env/homo_traffic@env    
  - /model/drlvo@model  
  - /algo/ppo_skrl@algo    

# --- 覆盖 ---
env:
  observation_cfg:
    modules: ["robot_node", "drlvo"] #
  reward_cfg:
    modules: ["nav", "traffic_future", "smoothness"] #
  # ... (其他 env 覆盖)
  arrival_threshold: 2.0
  use_global_path: False
  predict_steps: 0
  rew_evtol_future_penalty: -2.0
  rew_drone_future_penalty: -2.0
  rew_cross_track_coeff: -0.1
  rew_smoothness_coeff: -0.0

algo:
  rollouts: 128
  mini_batches: 32
  learning_rate: 4e-5
