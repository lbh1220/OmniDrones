# Demo configuration for traffic integration
# hydra.job.chdir: false
hydra:
  searchpath:
    # see https://hydra.cc/docs/advanced/search_path/
    - file://../cfg
headless: True
total_frames: 150_000_000
max_iters: -1
eval_interval: -1
save_interval: -1
seed: 0

# Simulation settings
sim:
  dt: 0.016
  substeps: 1
  gravity: [0, 0, -9.81]
  replicate_physics: false
  use_flatcache: true
  use_gpu_pipeline: true
  device: "cuda:0"

  solver_type: 1
  use_gpu: True
  bounce_threshold_velocity: 0.2
  friction_offset_threshold: 0.04
  friction_correlation_distance: 0.025
  enable_stabilization: True
  enable_scene_query_support: False

  # GPU buffers
  gpu_max_rigid_contact_count: 524288
  gpu_max_rigid_patch_count: 163840
  gpu_found_lost_pairs_capacity: 4194304
  gpu_found_lost_aggregate_pairs_capacity: 33554432
  gpu_total_aggregate_pairs_capacity: 4194304
  gpu_max_soft_body_contacts: 1048576
  gpu_max_particle_contacts: 1048576
  gpu_heap_capacity: 67108864
  gpu_temp_buffer_capacity: 16777216
  gpu_max_num_partitions: 8

# Environment settings
env:
  num_envs: 2
  env_spacing: 4.0
  max_episode_length: 50000

# Task settings
task:
  drone_model:
    name: Hummingbird
    controller: LeePositionController
  randomization:
    drone:
      train:
        mass_scale: [0.5, 2.0]
        inertia_scale: [0.5, 2.0]
        t2w_scale: [0.7, 1.3]
        f2m_scale: [0.7, 1.3]
  time_encoding: true
  action_transform: null

# Traffic configuration
traffic:
  num_drones: 50
  num_evtols: 3
  flight_height: 20.0
  area_bounds:
    xmin: -50
    xmax: 50
    ymin: -50
    ymax: 50
  drone:
    model: firefly
    safety_radius: 1.0
    max_speed: 1.0
    arrival_threshold: 1.0
    target_num: 4
  evtol:
    model: iris
    safety_radius: 5.0
    max_speed: 2.0
    arrival_threshold: 2.0
    turn_radius: 10.0
    course_num: 4
  orca:
    enable: True
    neighbor_dist: 100.0
    time_horizon: 11.0
    time_horizon_obst: 11.0
    safety_space: 1.5
    max_neighbors: 10
  
  
  
  

    

# Viewer settings
viewer:
  resolution: [960, 720]
  eye: [8, 0, 6]
  lookat: [0, 0, 1]

# Demo settings
steps: 500
