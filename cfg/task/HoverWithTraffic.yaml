# Hover task with traffic simulation
name: HoverWithTraffic
defaults:
  # see https://hydra.cc/docs/advanced/overriding_packages/
  - /base/env_base@_here_
  - /base/sim_base@_here_
  - /traffic: traffic_base  # include traffic configuration

# _target_: omni_drones.envs.single.traffic_hover.TrafficAwareHover

# Simplified environment configuration for traffic testing
env:
  num_envs: 4
  max_episode_length: 500
  env_spacing: 4.0

task:
  drone_model:
    name: crazyflie
    controller: lee_position
  randomization:
    drone:
      train:
        mass_scale: [0.5, 2.0]
        inertia_scale: [0.5, 2.0]
        t2w_scale: [0.7, 1.3]
        f2m_scale: [0.7, 1.3]

# Traffic configuration - override default values
traffic:
  num_drones: 8
  drone_model: "crazyflie"
  flight_height: 6.0
  max_speed: 2.5
  area_bounds:
    xmin: -15.0
    xmax: 15.0
    ymin: -15.0
    ymax: 15.0
